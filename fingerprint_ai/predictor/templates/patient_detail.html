<!DOCTYPE html>
<html>

<head>

<title>Patient Detail</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
background:#eef2f7;
}

.card{
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="container mt-5">

<a href="/dashboard" class="btn btn-dark mb-4">
← Back to Dashboard
</a>

<div class="card p-4">

<h3 class="mb-4">Patient Detail</h3>

<div class="row">

<div class="col-md-4 text-center">

<img src="{{ patient.fingerprint.url }}" width="200" class="rounded shadow">

<p class="mt-2">Fingerprint Image</p>

</div>


<div class="col-md-8">

<h5>Patient Information</h5>

<hr>

<p><b>Name:</b> {{ patient.name }}</p>
<p><b>DOB:</b> {{ patient.dob }}</p>
<p><b>Mobile:</b> {{ patient.mobile }}</p>

<hr>

<h5>Prediction Result</h5>

<p><b>Blood Group:</b> {{ patient.predicted_group }}</p>
<p><b>Confidence:</b> {{ patient.confidence }}%</p>

<p><b>Date:</b> {{ patient.created_at }}</p>

</div>

</div>

</div>

</div>

</body>

</html>
