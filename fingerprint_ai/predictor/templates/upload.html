<!DOCTYPE html>
<html>

<head>

<title>AI Blood Group Detection</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>


body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial;

background: linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1c3b4d);
background-size:400% 400%;

animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}
#particles-js{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
z-index:-1;
}

.main-card{
background:white;
padding:40px;
border-radius:15px;
width:750px;
box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

.section-box{
background:#f8fafc;
padding:20px;
border-radius:10px;
border:1px solid #dfe6ef;
}

.section-title{
font-weight:bold;
margin-bottom:15px;
color:#2c5364;
}

.form-control{
background:#eef2f7;
border:2px solid #d1d9e6;
border-radius:8px;
}

.form-control:focus{
background:white;
border-color:#2c5364;
box-shadow:0 0 8px rgba(44,83,100,0.4);
}

.predict-btn{
padding:10px 40px;
font-size:16px;
}

#previewImage{
display:none;
width:120px;
margin-top:10px;
border-radius:10px;
}
.scanner-line{

position:relative;
width:220px;
height:2px;
background:red;

animation:scan 2s linear infinite;

margin:auto;
}

@keyframes scan{

0%{
transform:translateY(-100px);
}

100%{
transform:translateY(100px);
}

}

</style>

</head>

<body>
    <div id="particles-js"></div>

<div class="main-card">

<h2 class="text-center mb-4">
AI Fingerprint Blood Group Detection
</h2>

<form method="post" enctype="multipart/form-data">

{% csrf_token %}

<input type="hidden" name="captured_image" id="capturedImage">

<div class="row g-4">

<!-- Patient Info -->

<div class="col-md-6">

<div class="section-box">

<h5 class="section-title">Patient Information</h5>

<input class="form-control mb-3"
type="text"
name="name"
placeholder="Patient Name"
required>

<input class="form-control mb-3"
type="date"
name="dob"
required>

<input class="form-control mb-3"
type="text"
name="mobile"
placeholder="Mobile Number"
required>

</div>

</div>


<!-- Fingerprint Section -->

<div class="col-md-6">

<div class="section-box">

<h5 class="section-title">Fingerprint Upload</h5>

<input
class="form-control mb-3"
type="file"
name="fingerprint"
id="fingerprintInput">

<img id="previewImage">

<button
type="button"
class="btn btn-dark mt-3 w-100"
onclick="openCamera()">

<i class="fas fa-fingerprint"></i>
Scan Fingerprint

</button>

<p class="text-muted small mt-2">
Upload or scan a fingerprint image.
</p>

</div>

</div>

</div>


<!-- Camera Section -->

<div id="cameraSection"
style="display:none;text-align:center;margin-top:20px">

<video id="video" width="220" autoplay></video>
<div class="scanner-line"></div>
<br><br>

<button
type="button"
class="btn btn-success"
onclick="captureFingerprint()">

Capture Fingerprint

</button>

<canvas id="canvas" style="display:none"></canvas>

</div>


<!-- Buttons -->

<div class="d-flex justify-content-center mt-4 gap-3">

<button class="btn btn-primary predict-btn">
Predict Blood Group
</button>

<a href="/dashboard"
class="btn btn-outline-dark predict-btn">
View Dashboard
</a>

</div>

</form>

</div>

<script>

const input=document.getElementById("fingerprintInput");
const preview=document.getElementById("previewImage");

input.addEventListener("change",function(){

const file=this.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(e){

preview.src=e.target.result;
preview.style.display="block";

}

reader.readAsDataURL(file);

}

});


let video=document.getElementById("video");
let canvas=document.getElementById("canvas");
let stream=null;

function openCamera(){

document.getElementById("cameraSection").style.display="block";

navigator.mediaDevices.getUserMedia({video:true})
.then(function(s){

stream=s;
video.srcObject=s;

})
.catch(function(){

alert("Camera access denied");

});

}

function captureFingerprint(){

let context=canvas.getContext("2d");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

context.drawImage(video,0,0);

let imageData=canvas.toDataURL("image/png");

preview.src=imageData;
preview.style.display="block";

document.getElementById("capturedImage").value=imageData;

if(stream){
stream.getTracks().forEach(track=>track.stop());
}

document.getElementById("cameraSection").style.display="none";

}

</script>
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<script>

particlesJS("particles-js",{

particles:{

number:{value:60},

size:{value:3},

move:{speed:1},

line_linked:{enable:true},

color:{value:"#ffffff"}

}

});

</script>

</body>

</html>
